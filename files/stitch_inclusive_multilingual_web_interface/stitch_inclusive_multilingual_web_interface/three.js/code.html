## 1. Executive Summary & Vision

The **"React Fluids"** animation framework introduces organic, mathematically-governed Navier-Stokes fluid and curl-noise swirling dynamics into the Setu civic infrastructure platform. 

In public-sector and civic technology, animations must never feel frivolous or purely decorative. Instead, fluid dynamics on Setu serve three critical functional objectives:
1. **Humanizing Asynchronous Latency:** Transforming high-friction waiting periods (e.g., 2G packet syncing, dialect ASR batch transcription, Kafka streaming clustering) into calming, visually intelligible progress states.
2. **Visualizing Voice & Dialect Acoustic Ingestion:** Providing an intuitive, low-literacy-first visual resonance for citizen voice reports (audio waveforms translating into responsive fluid turbulence).
3. **Harmonizing with the Glacier Blue Theme:** Translating the crisp, sovereign glacier aesthetic into flowing streams, eddies, and ripples that evoke clean water, open energy, and civic trust across both **Light Mode** and **Dark Mode**.

## 2. Core Physics & Mathematical Formulation

The fluid simulation is grounded in two-dimensional incompressible Navier-Stokes equations solved in real-time on GPU fragment shaders with stable MacCormack advection and viscous diffusion:

$$\frac{\partial \mathbf{u}}{\partial t} = -(\mathbf{u} \cdot \nabla)\mathbf{u} - \frac{1}{\rho}\nabla p + \nu \nabla^2 \mathbf{u} + \mathbf{f}$$

$$\nabla \cdot \mathbf{u} = 0$$

Where:
- $\mathbf{u} = (u, v)$ is the velocity vector field.
- $p$ is scalar fluid pressure computed via Jacobi / Multigrid Poisson iteration.
- $\nu$ is kinematic viscosity (calibrated to mimic cold glacial water: low diffusion, crisp vortex retention).
- $\mathbf{f}$ represents external force injection (user cursor drag, microphone RMS audio amplitude, or gyro tilt).

### 2.1 Curl Noise & Vorticity Confinement
To maintain vibrant swirling micro-structures without rapid dampening on low-power devices, an artificial vorticity confinement step evaluates the curl:

$$\omega = \nabla \times \mathbf{u} = \frac{\partial v}{\partial x} - \frac{\partial u}{\partial y}$$

$$\mathbf{f}_{\text{vort}} = \epsilon \left( \frac{\nabla |\omega|}{|\nabla |\omega||} \times (0, 0, \omega) \right) \cdot \Delta t$$

## 4. Key Component Implementations

### 4.1 Voice Recording & Speech-to-Text Ingestion Interface
In accordance with `Design.md` §3 and `Rules.md` §6, citizen reporting must prioritize low-literacy and voice-first channels. The Voice Record Button incorporates an ambient-to-active fluid membrane:

1. **Idle State:**
   - Soft, low-amplitude radial harmonic pulsation ($\Delta r = \pm 3\text{px}$, period $T = 3.2\text{s}$).
   - Color: Subdued Glacier Blue `#0284C7` at 15% opacity.
   - Conveys platform readiness without inducing distraction.

2. **Active Listening / Recording State (Microphone Engaged):**
   - Web Audio API `AnalyserNode` streams live frequency bins and time-domain volume into WebGL uniforms (`u_audio_rms`, `u_frequency_centroid`).
   - High-amplitude audio peaks inject perpendicular velocity vectors $\mathbf{f}_{\text{ext}} = k \cdot A_{\text{mic}} \cdot \mathbf{n}_{\text{radial}}$ around the perimeter.
   - Vorticity spikes dynamically with voice pitch; deep consonants generate wide billows, while sibilants trigger luminous micro-vortices.
   - Tactile feedback: CSS glow filters `drop-shadow(0 0 16px rgba(14, 165, 233, 0.65))` pulsate synchronously.

3. **Batch ASR & PII Redaction Buffering:**
   - When the user releases the mic, the fluid transitions into an inward-coiling golden-spiral vortex ($\theta(r) = a \cdot e^{b r}$).
   - Viscosity increases linearly ($\nu \uparrow$) to signify compression and sanitization ("cleansing" audio before tokenization per `Rules.md` §2).

### 4.2 Async Telemetry & Kafka Stream Buffering
For national hotspot telemetry maps, pipeline monitors, and municipal triage queues:
- **Streaming Pipeline Node:** Fluid indicators swirl gently inside badge rings (`w-6 h-6`) indicating live Kafka broker partitions.
- **Data Loaders & Table Spinners:** Replaces generic circular CSS spinners with a self-contained, looping 48px micro-fluid eddy that swirls through the Glacier Blue gradient with zero jitter.
- **Sub-350ms Latency Cues:** Quick velocity dissipation confirms ingest ack; if network falls back to 2G cache, the fluid enters a "cold crystallization" state with frozen velocity vectors and a local storage badge.

## 5. Performance Budget, Optimization & Multi-Tier Fallbacks

To ensure seamless operation on low-cost entry-level smartphones and sub-$60 rural field devices:

### 5.1 Simulation Resolution & Memory Caps
- **Desktop (High Tier):** Simulation grid size $256 \times 256$, full Float32 textures (`OES_texture_float`), 20 Jacobi pressure iterations, 60 FPS cap.
- **Mobile / Integrated GPU (Mid Tier):** Half-float textures (`OES_texture_half_float`), grid downscaled to $128 \times 128$, 12 Jacobi iterations, 45 FPS cap.
- **Low-End / 2G Devices (Tier 1 Fallback):** Pure CSS3 `@keyframes` radial fluid distortion using layered SVGs and GPU-accelerated CSS filters (`backdrop-filter: blur()`, `mix-blend-mode: screen`).
- **Texture Memory Allocation:** Total VRAM allocated to fluid framebuffers must never exceed **8.5 MB**.

### 5.2 Power & Battery Awareness
- Simulation loop halts completely (`cancelAnimationFrame`) when the element is off-screen using `IntersectionObserver`.
- Fluid dynamics pause after 4 seconds of user inactivity unless in an active recording or streaming state.

---

## 6. Accessibility (WCAG 2.1 AA) & Motion Sensitivity

Conforming strictly to `Rules.md` §6 and WCAG 2.2 Success Criterion **2.3.3 (Animation from Interactions)**:

1. **`prefers-reduced-motion` Enforcement:**
   - When `@media (prefers-reduced-motion: reduce)` is detected:
     - WebGL fluid solver is completely disabled.
     - Interactive elements revert to instantaneous or calm static opacity changes ($\Delta \alpha \le 0.15$).
     - Audio recording displays a predictable, non-swirling solid green/blue status ring with unambiguous text ("Recording...", "Transcribing...").
2. **Contrast Guarantees:**
   - Swirling fluid backgrounds maintain strict contrast boundaries ($> 4.5:1$ against all foreground text and $> 3:1$ against essential glyphs).
   - Maximum background opacity is clamped to 0.12 in Light Mode and 0.22 in Dark Mode.
3. **Flashing & Seizure Prevention:**
   - Velocity impulses are clamped to prevent rapid flickering or strobe effects; maximum luminosity delta is bounded at $\Delta L^* < 10\%$ per frame.

## 7. React & Web Component Integration Guide

```tsx
/**
 * React Fluids Ambient & Interactive Component for Setu Platform
 * Reference Implementation for Voice Recording & Loading states
 */
import React, { useRef, useEffect } from 'react';

interface SetuFluidProps {
  mode?: 'light' | 'dark';
  variant: 'voice-reactive' | 'telemetry-buffer' | 'ambient-backdrop';
  audioStream?: MediaStream | null;
  interactive?: boolean;
  className?: string;
}

export const SetuFluidEngine: React.FC<SetuFluidProps> = ({
  mode = 'light',
  variant,
  audioStream,
  interactive = true,
  className = 'w-full h-full'
}) => {
  const canvasRef = useRef<HTMLCanvasElement | null>(null);

  useEffect(() => {
    // 1. Check for reduced motion preference
    const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (mediaQuery.matches) return;

    // 2. Initialize WebGL Fluid Context with Glacier Blue Color Ramps
    const canvas = canvasRef.current;
    if (!canvas) return;

    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    if (!gl) return; // Automatic graceful degradation

    // Configuration tailored to Glacier Civic design system
    const config = {
      DYE_RESOLUTION: window.innerWidth < 768 ? 128 : 256,
      SIM_RESOLUTION: window.innerWidth < 768 ? 64 : 128,
      DENSITY_DISSIPATION: 0.97,
      VELOCITY_DISSIPATION: 0.98,
      PRESSURE_ITERATIONS: 16,
      CURL: 24.0,
      SPLPLAT_RADIUS: 0.004,
      PALETTE: mode === 'dark' 
        ? { base: [0.015, 0.054, 0.129], primary: [0.007, 0.517, 0.780], accent: [0.490, 0.827, 0.988] }
        : { base: [0.878, 0.949, 0.996], primary: [0.219, 0.741, 0.972], accent: [0.011, 0.411, 0.631] }
    };

    // 3. Audio reactivity binding if active recording
    let audioContext: AudioContext | null = null;
    let analyser: AnalyserNode | null = null;
    let dataArray: Uint8Array | null = null;

    if (variant === 'voice-reactive' && audioStream) {
      audioContext = new (window.AudioContext || (window as any).webkitAudioContext)();
      const source = audioContext.createMediaStreamSource(audioStream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 64;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);
    }

    // [Fluid simulation render loop & Navier-Stokes integration continues]

    return () => {
      if (audioContext) audioContext.close();
    };
  }, [mode, variant, audioStream]);

  return (
    <canvas 
      ref={canvasRef} 
      className={`pointer-events-none ${className}`}
      aria-hidden="true" 
    />
  );
};
```
